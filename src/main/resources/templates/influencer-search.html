<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Search Influencers</title>
    <style>
        :root {
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: rgba(15, 23, 42, 0.12);
            --shadow: 0 18px 40px rgba(2, 6, 23, 0.18);
            --primary: #2563eb;
            --primaryHover: #1d4ed8;
            --success: #22c55e;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
            color: var(--text);
            background:
                linear-gradient(135deg, rgba(14,165,233,0.10), rgba(99,102,241,0.08)),
                url('/auth-bg.svg');
            background-size: cover;
            background-position: center;
            padding: 24px;
        }

        .card {
            max-width: 980px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            box-shadow: var(--shadow);
        }

        h1 { margin: 0 0 6px; font-size: 1.45rem; letter-spacing: -0.01em; }
        .muted { color: var(--muted); }

        .top { display:flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .brand { display:flex; align-items:center; gap: 12px; }
        .logo { width: 52px; height: 52px; border-radius: 12px; overflow: hidden; background: rgba(37, 99, 235, 0.06); border: 1px solid rgba(15, 23, 42, 0.10); display: grid; place-items: center; }
        .logo img { width: 36px; height: 36px; object-fit: contain; }

        .btn { display:inline-block; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(15,23,42,0.12); background: #fff; color: var(--text); font-weight:600; text-decoration:none; }
        .btn:hover { background: rgba(37,99,235,0.06); }
        .btn-primary { background: var(--primary); border-color: transparent; color: #fff; }
        .btn-primary:hover { background: var(--primaryHover); }

        .form-grid { display: grid; gap: 12px; grid-template-columns: 1fr; margin-top: 14px; }
        @media (min-width: 760px) { .form-grid { grid-template-columns: 1fr 1fr 1fr; } }
        .form-row { display:flex; gap: 8px; align-items:center; }
        label { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; display:block; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #fff; }

        .results { margin-top: 18px; }
        .result-item { display:flex; gap: 12px; align-items:center; padding: 12px; border-radius: 10px; border: 1px solid rgba(15,23,42,0.06); background: rgba(15,23,42,0.02); }
        .result-item + .result-item { margin-top: 8px; }
        .avatar { width: 64px; height: 64px; border-radius: 10px; overflow:hidden; background: #fff; display:grid; place-items:center; }
        .avatar img { width:64px; height:64px; object-fit:cover; }

        .meta { display:flex; flex-direction:column; }
        .meta .title { font-weight:700; font-size:1rem; }
        .meta .sub { color:var(--muted); font-size:0.9rem; }

        .pagination { margin-top: 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .page-link { padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:#fff; text-decoration:none; color:var(--text); }
        .page-link.active { background:var(--primary); color:#fff; border-color:transparent; }

        @media (max-width: 420px) { body { padding: 16px; } .card { padding: 14px; } }
    </style>
</head>
<body>
<div class="card">
    <div class="top">
        <div class="brand">
            <div class="logo" aria-hidden="true">
                <img th:src="@{/brand-logo.svg}" alt="inFluApp" />
            </div>
            <div>
                <h1>Find influencers</h1>
                <div class="muted">Search and filter influencers to match your campaign</div>
            </div>
        </div>

        <div>
            <a th:href="@{/business/home}" class="btn">Back</a>
            <a th:href="@{/logout}" class="btn btn-primary">Logout</a>
        </div>
    </div>

    <form th:action="@{/influencers/search}" method="get" th:object="${searchDto}" style="margin-top:16px;">
        <div class="form-grid">
            <div>
                <label>Keyword</label>
                <input type="text" th:field="*{keyword}" placeholder="Search name or bio" />
            </div>

            <div>
                <label>Category</label>
                <select th:field="*{category}">
                    <option value="">Any</option>
                    <option th:each="c : ${allCategories}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>

            <div>
                <label>Type</label>
                <select th:field="*{type}">
                    <option value="">Any</option>
                    <option th:each="t : ${allTypes}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>

            <div>
                <label>Min followers</label>
                <input type="number" th:field="*{minFollowers}" placeholder="e.g. 1000" />
            </div>

            <div>
                <label>Max budget</label>
                <input type="number" th:field="*{maxBudget}" placeholder="e.g. 500" />
            </div>

            <div>
                <label>Location</label>
                <input type="text" th:field="*{location}" placeholder="City or country" />
            </div>

            <div>
                <label>Available</label>
                <div class="form-row"><input type="checkbox" th:field="*{isAvailable}"/> <span class="muted" style="margin-left:8px;">Only show available</span></div>
            </div>

            <div>
                <label>Sort by</label>
                <select name="sort">
                    <option th:value="totalFollowers" th:selected="${sortField=='totalFollowers'}">Followers</option>
                    <option th:value="influencerScore" th:selected="${sortField=='influencerScore'}">Score</option>
                    <option th:value="engagementRate" th:selected="${sortField=='engagementRate'}">Engagement</option>
                </select>
            </div>

            <div>
                <label>Direction</label>
                <select name="dir">
                    <option th:value="DESC" th:selected="${sortDir=='DESC'}">Descending</option>
                    <option th:value="ASC" th:selected="${sortDir=='ASC'}">Ascending</option>
                </select>
            </div>

            <div>
                <label>Page size</label>
                <select name="size">
                    <option th:value="5" th:selected="${size==5}">5</option>
                    <option th:value="10" th:selected="${size==10}">10</option>
                    <option th:value="20" th:selected="${size==20}">20</option>
                </select>
            </div>

        </div>

        <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
            <input type="hidden" name="page" th:value="${currentPage}"/>
            <button class="btn btn-primary" type="submit">Search</button>
            <a th:href="@{/influencers/search}" class="btn">Reset</a>
        </div>
    </form>

    <div class="results">
        <div th:if="${results == null or results.content.size() == 0}" class="muted" style="margin-top:12px;">No results</div>

        <div th:if="${results != null}" style="margin-top:12px;">
            <div class="muted" th:text="'Showing page ' + ${results.number + 1} + ' of ' + ${results.totalPages}"></div>

            <div th:each="inf : ${results.content}" class="result-item" style="margin-top:12px;">
                <div class="avatar">
                    <img th:if="${inf.imageUrl != null}" th:src="${inf.imageUrl}" alt="avatar" />
                    <img th:if="${inf.imageUrl == null}" th:src="@{/brand-logo.svg}" alt="placeholder" />
                </div>
                <div class="meta">
                    <div class="title" th:text="${inf.name}">Name</div>
                    <div class="sub">
                        <span th:text="${inf.username}">username</span> • <span th:text="${inf.totalFollowers}">0</span> followers • <span th:text="${inf.influencerType}">TYPE</span>
                    </div>
                    <div class="muted" th:text="${inf.bio}"></div>
                </div>
                <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
                    <a th:href="@{/influencer/profile(id=${inf.id})}" class="btn">View</a>
                </div>
            </div>

            <div class="pagination">
                <a th:if="${results.hasPrevious()}" th:href="@{/influencers/search(page=${results.number - 1}, size=${size}, sort=${sortField}, dir=${sortDir}, keyword=${searchDto.keyword}, category=${searchDto.category}, type=${searchDto.type}, minFollowers=${searchDto.minFollowers}, maxBudget=${searchDto.maxBudget}, isAvailable=${searchDto.isAvailable}, location=${searchDto.location})}" class="page-link">Prev</a>

                <span th:each="i : ${#numbers.sequence(0, totalPages > 0 ? totalPages - 1 : 0)}">
                    <a th:href="@{/influencers/search(page=${i}, size=${size}, sort=${sortField}, dir=${sortDir}, keyword=${searchDto.keyword}, category=${searchDto.category}, type=${searchDto.type}, minFollowers=${searchDto.minFollowers}, maxBudget=${searchDto.maxBudget}, isAvailable=${searchDto.isAvailable}, location=${searchDto.location})}" class="page-link" th:classappend="${i == results.number} ? ' active' : ''" th:text="${i + 1}">1</a>
                </span>

                <a th:if="${results.hasNext()}" th:href="@{/influencers/search(page=${results.number + 1}, size=${size}, sort=${sortField}, dir=${sortDir}, keyword=${searchDto.keyword}, category=${searchDto.category}, type=${searchDto.type}, minFollowers=${searchDto.minFollowers}, maxBudget=${searchDto.maxBudget}, isAvailable=${searchDto.isAvailable}, location=${searchDto.location})}" class="page-link">Next</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
