<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Collaboration</title>
    <style>
        :root { --primary:#2563eb; --primaryHover:#1d4ed8; --text:#0f172a; --muted:#64748b; --border:rgba(15,23,42,0.12); --shadow:0 18px 40px rgba(2,6,23,0.18); }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--text);
            background:linear-gradient(135deg,rgba(14,165,233,0.30),rgba(99,102,241,0.30)),url('/auth-bg.svg'); background-size:cover; background-position:center; background-attachment:fixed; padding:24px; }
        .card { max-width:800px; margin:0 auto; background:#fff; border:1px solid var(--border); border-radius:14px; padding:24px; box-shadow:var(--shadow); }
        h1 { margin:0 0 4px; font-size:1.35rem; }
        h2 { margin:18px 0 8px; font-size:1.15rem; }
        .muted { color:var(--muted); }
        .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
        .info-box { background:rgba(15,23,42,0.03); border:1px solid rgba(15,23,42,0.08); border-radius:10px; padding:10px; }
        .info-box strong { display:block; margin-bottom:2px; }
        .btn { display:inline-block; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:#fff; color:var(--text); font-weight:600; text-decoration:none; cursor:pointer; }
        .btn:hover { background:rgba(37,99,235,0.06); }
        .btn-primary { background:var(--primary); border-color:transparent; color:#fff; }
        .btn-primary:hover { background:var(--primaryHover); }
        .post-card { background:rgba(15,23,42,0.03); border:1px solid rgba(15,23,42,0.08); border-radius:10px; padding:12px; margin-bottom:10px; }
        .post-meta { display:flex; gap:12px; flex-wrap:wrap; margin-top:6px; }
        .post-meta span { font-size:.88rem; }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="${collaboration.campaign.title}">Campaign</h1>
    <div class="muted" th:text="'Business: ' + ${collaboration.campaign.business.companyName}">Business</div>

    <div class="info-grid">
        <div class="info-box">
            <strong>Payment</strong>
            <span th:text="${collaboration.paymentAmount} + ' €'">0 €</span>
        </div>
        <div class="info-box">
            <strong>Status</strong>
            <span th:text="${collaboration.status}">PENDING</span>
        </div>
        <div class="info-box">
            <strong>Deliverables</strong>
            <span th:text="${collaboration.deliverables != null ? collaboration.deliverables : '-'}">-</span>
        </div>
        <div class="info-box">
            <strong>Start date</strong>
            <span th:text="${collaboration.startDate != null ? collaboration.startDate : '-'}">-</span>
        </div>
    </div>

    <!-- Posts section -->
    <h2>Posts</h2>
    <div th:if="${collaboration.posts == null or collaboration.posts.isEmpty()}" class="muted">No posts yet</div>

    <div th:if="${collaboration.posts != null and !collaboration.posts.isEmpty()}">
        <div th:each="p : ${collaboration.posts}" class="post-card">
            <div style="font-weight:600;" th:text="${p.socialMedia != null ? p.socialMedia.platform : 'Unknown platform'}">INSTAGRAM</div>
            <div th:if="${p.content != null}" th:text="${p.content}" style="margin-top:4px;">content</div>
            <div class="post-meta">
                <span class="muted" th:text="'Reach: ' + ${p.reach != null ? p.reach : 0}">Reach: 0</span>
                <span class="muted" th:text="'Impressions: ' + ${p.impressionCount != null ? p.impressionCount : 0}">Impressions: 0</span>
                <span class="muted" th:text="'Shares: ' + ${p.shares != null ? p.shares : 0}">Shares: 0</span>
                <span class="muted" th:text="'Engagement: ' + ${p.engagementRate != null ? p.engagementRate : 0} + '%'">Engagement: 0%</span>
                <span class="muted" th:if="${p.postSentiment != null}" th:text="'Sentiment: ' + ${p.postSentiment}">Sentiment</span>
            </div>
            <div th:if="${p.reactions != null and !p.reactions.isEmpty()}" style="margin-top:4px;">
                <span th:each="r : ${p.reactions}" class="muted" style="margin-right:8px;"
                      th:text="${r.type.emoji} + ' ' + ${r.count}">👍 0</span>
            </div>
        </div>
    </div>

    <div style="margin-top:16px;display:flex;gap:10px;">
        <a th:if="${isInfluencer}" th:href="@{'/collaborations/' + ${collaboration.id} + '/posts/new'}" class="btn btn-primary">Add Post</a>
        <a th:if="${isInfluencer}" th:href="@{/influencer/collaborations/active}" class="btn">Back</a>
        <a th:if="${isInfluencer}" th:href="@{/influencer/home}" class="btn">Home</a>
        <a th:if="${!isInfluencer}" th:href="@{/business/collaborations}" class="btn">Back</a>
        <a th:if="${!isInfluencer}" th:href="@{/business/home}" class="btn">Home</a>
    </div>
</div>
</body>
</html>
