<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Campaigns</title>
    <style>
        :root { --card:#fff; --text:#0f172a; --muted:#64748b; --border:rgba(15,23,42,0.12); --shadow:0 18px 40px rgba(2,6,23,0.18); --primary:#2563eb; --primaryHover:#1d4ed8; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--text);
            background:linear-gradient(135deg,rgba(14,165,233,0.30),rgba(99,102,241,0.30)),url('/auth-bg.svg'); background-size:cover; background-position:center; background-attachment:fixed; padding:24px; }
        .card { max-width:980px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow); }
        h1 { margin:0 0 6px; font-size:1.45rem; letter-spacing:-0.01em; }
        .muted { color:var(--muted); }
        a { color:var(--primary); text-decoration:none; }
        a:hover { text-decoration:underline; }
        .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
        .brand { display:flex; align-items:center; gap:12px; }
        .logo { width:42px; height:42px; border-radius:12px; overflow:hidden; background:rgba(37,99,235,0.06); border:1px solid rgba(15,23,42,0.10); display:grid; place-items:center; flex:0 0 auto; }
        .logo img { width:30px; height:30px; display:block; object-fit:contain; }
        .actions { display:flex; align-items:center; gap:10px; }
        .btn { display:inline-block; padding:10px 12px; border-radius:10px; border:1px solid rgba(15,23,42,0.12); background:#fff; color:var(--text); font-weight:600; text-decoration:none; cursor:pointer; }
        .btn:hover { background:rgba(37,99,235,0.06); text-decoration:none; }
        .btn-primary { background:var(--primary); border-color:transparent; color:#fff; }
        .btn-primary:hover { background:var(--primaryHover); }
        .campaign-item { background:rgba(15,23,42,0.03); border:1px solid rgba(15,23,42,0.08); border-radius:12px; padding:14px; margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .status-badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.8rem; font-weight:600; }
        .status-draft { background:rgba(148,163,184,0.15); color:#475569; }
        .status-active { background:rgba(34,197,94,0.12); color:#15803d; }
        .status-completed { background:rgba(37,99,235,0.12); color:#1d4ed8; }
        .status-cancelled { background:rgba(239,68,68,0.12); color:#b91c1c; }
        @media (max-width:500px) { .campaign-item { flex-direction:column; align-items:flex-start; } }
    </style>
</head>
<body>
<div class="card">
    <div class="top">
        <div class="brand">
            <div class="logo" aria-hidden="true" style="width:64px;height:64px;">
                <img th:src="@{/brand-logo.svg}" alt="inFluApp" />
            </div>
            <div>
                <h1>My Campaigns</h1>
                <div class="muted">Manage your marketing campaigns</div>
            </div>
        </div>
        <div class="actions">
            <a class="btn btn-primary" th:href="@{/business/campaigns/new}">+ New campaign</a>
            <a class="btn" th:href="@{/business/home}">Home</a>
        </div>
    </div>

    <div th:if="${campaigns == null or #lists.isEmpty(campaigns)}" style="text-align:center;padding:40px;">
        <div class="muted">No campaigns yet. Create your first one!</div>
    </div>

    <div th:if="${campaigns != null and !#lists.isEmpty(campaigns)}">
        <div th:each="c : ${campaigns}" class="campaign-item">
            <div>
                <div style="font-weight:700;font-size:1.05rem;" th:text="${c.title}">Campaign</div>
                <div style="margin-top:4px;">
                    <span class="status-badge"
                          th:classappend="'status-' + ${c.status.name().toLowerCase()}"
                          th:text="${c.status}">DRAFT</span>
                </div>
                <div class="muted" style="margin-top:4px;" th:text="'Category: ' + ${c.targetCategory}">Category</div>
                <div style="margin-top:4px;">
                    <span class="muted" th:text="${'Budget: ' + #numbers.formatDecimal(c.budget,1,2) + ' €'}">Budget</span>
                    &nbsp;&mdash;&nbsp;
                    <span th:if="${c.remainingBudget != null and c.remainingBudget >= 0}" class="muted" th:text="${'Remaining: ' + #numbers.formatDecimal(c.remainingBudget,1,2) + ' €'}">Remaining</span>
                    <span th:if="${c.remainingBudget != null and c.remainingBudget < 0}" style="color:#b91c1c;font-weight:700;" th:text="${'Over budget by ' + #numbers.formatDecimal(-c.remainingBudget,1,2) + ' €'}">Over budget</span>
                </div>
                <div class="muted" th:text="'Collaborations: ' + ${c.collaborations != null ? c.collaborations.size() : 0}">0</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <a th:href="@{'/business/campaigns/' + ${c.id}}" class="btn">View</a>
                <a th:href="@{'/business/campaigns/' + ${c.id} + '/edit'}" class="btn">Edit</a>
                <form th:action="@{'/business/campaigns/' + ${c.id} + '/delete'}" method="post" style="display:inline;">
                    <button type="submit" class="btn" style="font-size:0.85rem;padding:8px 10px;color:#b91c1c;border-color:rgba(239,68,68,0.3);"
                            onclick="return confirm('Delete this campaign and all its collaborations?')">🗑</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
