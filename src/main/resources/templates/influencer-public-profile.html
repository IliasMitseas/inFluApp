<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Influencer Profile</title>
    <style>
        :root{--card:#fff;--text:#0f172a;--muted:#64748b;--border:rgba(15,23,42,0.12);--primary:#2563eb}
        body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6fafc;padding:24px}
        .card{max-width:800px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
        .top{display:flex;align-items:center;gap:12px}
        .avatar{width:96px;height:96px;border-radius:12px;overflow:hidden}
        .avatar img{width:100%;height:100%;object-fit:cover}
        .meta{display:flex;flex-direction:column}
        .meta .name{font-weight:700;font-size:1.2rem}
        .meta .sub{color:var(--muted)}
        .actions{margin-top:12px;display:flex;gap:8px}
        .btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;text-decoration:none;color:var(--text)}
        .btn-primary{background:var(--primary);color:#fff;border-color:transparent}
    </style>
</head>
<body>
<div class="card">
    <div class="top">
        <div class="avatar">
            <img th:if="${influencer.imageUrl != null}" th:src="${influencer.imageUrl}" alt="avatar"/>
            <img th:if="${influencer.imageUrl == null}" th:src="@{/brand-logo.svg}" alt="avatar"/>
        </div>
        <div class="meta" style="flex:1">
            <div class="name" th:text="${influencer.name}">Name</div>
            <div class="sub">
                <span th:text="${influencer.username}">username</span> • <span th:text="${influencer.totalFollowers}">0</span> followers • <span th:text="${influencer.influencerType}">TYPE</span>
            </div>
            <div class="muted" th:text="${influencer.location}"></div>
        </div>
        <div>
            <a th:href="@{/collaborations/request(influencerId=${influencer.id})}" class="btn btn-primary">Request collaboration</a>
        </div>
    </div>

    <div style="margin-top:12px;">
        <h3>About</h3>
        <div class="muted" th:text="${influencer.bio}"></div>
    </div>

    <div style="margin-top:12px;">
        <h3>Platforms</h3>
        <div th:if="${influencer.socialMediaAccounts == null or influencer.socialMediaAccounts.isEmpty()}">No platforms</div>
        <ul th:if="${influencer.socialMediaAccounts != null}">
            <li th:each="sm : ${influencer.socialMediaAccounts}">
                <span th:text="${sm.platform}">PLATFORM</span> — <span th:text="${sm.accountUrl}">url</span> • <span th:text="${sm.followers}">0</span> followers
            </li>
        </ul>
    </div>
</div>
</body>
</html>
